<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>YouTube Playlist Buttons</title>
  <style>
    body { font-family: sans-serif; padding: 10px; width: 360px; box-sizing: border-box; background-color: #282828; color: #fff }
    h3 { margin: 0 0 8px 0; }
    .hint { font-size: 12px; opacity: 0.8; margin-bottom: 10px; }
    .row {
      display: flex;
      grid-template-columns: 1fr 72px;
      align-items: end;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 8px;
    }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 3px; }
    input {background-color: #d0d0d0;}
    input[type="text"]:hover {
      cursor: text;
    }
    input[type="text"] { box-sizing: border-box; padding: 6px 8px; font-size: 13px; overflow: hidden;   text-overflow: ellipsis; white-space: nowrap; }
    input[type="text"].textInput { box-sizing: border-box; padding: 6px 8px; font-size: 13px; width: 100px; margin-right: 3px;}
    input[type="text"].playlistInput { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 13px; margin-right: 5px;}
    input[type="color"] { width: 100%; height: 34px; padding: 0; border: none; background: transparent; width: 30px; cursor: pointer; padding-top: 4px; margin-right: 5px;}
    .full { grid-column: 1 / -1; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    button { padding: 8px; font-size: 13px; cursor: pointer; }
    .removeBtn { 
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      margin-left: 6px;
      border-radius: 30px;
      border: 1px solid rgba(241,241,241,0.5);
      background: rgba(247, 100, 100, 0.5);
      cursor: pointer; 
    }
    /*.status { margin-top: 10px; font-size: 12px; min-height: 16px; }*/
    #addBtn {
      background-color: #446ad4;
      border-radius: 10px;
      margin-right: auto;
    }
    #saveBtn {
      background-color: #33b23d;
      border-radius: 10px;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <h3>Youtube Buttons</h3>
  <div class="hint">Each entry creates a button above video titles.</div>

  <div id="list"></div>

  <div class="actions">
    <button id="addBtn" type="button">Add button</button>
    <button id="saveBtn" type="button">Save</button>
  </div>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
