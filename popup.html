<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>YouTube Playlist Buttons</title>
  <style>
    :root {
      --bg: #212121;
      --card: #2c2c2c;
      --field: #181818;
      --border: #3f3f3f;
      --text: #f1f1f1;
      --muted: #aaaaaa;
      --accent: #3ea6ff;
      --danger: #ff4e45;
    }
    body {
      font-family: Roboto, "Segoe UI", system-ui, sans-serif;
      padding: 12px;
      width: 360px;
      box-sizing: border-box;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
    }
    h3 { margin: 0 0 4px 0; font-size: 16px; font-weight: 600; }
    .hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      padding: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 120ms;
    }
    .row:focus-within { border-color: #5a5a5a; }
    .row > .grow { flex: 1; min-width: 0; }

    /* Text fields */
    input[type="text"] {
      box-sizing: border-box;
      height: 32px;
      padding: 0 10px;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: border-color 120ms, box-shadow 120ms;
    }
    input[type="text"]::placeholder { color: #717171; }
    input[type="text"]:hover { border-color: #5a5a5a; }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(62, 166, 255, 0.25);
    }
    input.textInput { width: 90px; font-weight: 600; }
    input.playlistInput { width: 100%; font-family: Consolas, "Roboto Mono", monospace; font-size: 12px; }

    /* Colour swatch */
    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--field);
      cursor: pointer;
      display: block;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
    input[type="color"]:hover { border-color: #5a5a5a; }
    input[type="color"]:focus-visible { outline: none; border-color: var(--accent); }

    /* Remove */
    .removeBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: background 120ms;
    }
    .removeBtn svg { width: 18px; height: 18px; fill: var(--muted); transition: fill 120ms; }
    .removeBtn:hover { background: rgba(255, 78, 69, 0.15); }
    .removeBtn:hover svg { fill: var(--danger); }
    .removeBtn:focus-visible { outline: 2px solid var(--accent); }

    /* Actions */
    .actions { display: flex; gap: 8px; margin-top: 4px; }
    #addBtn {
      width: 100%;
      height: 34px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      background: transparent;
      border: 1px dashed #4a4a4a;
      border-radius: 10px;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }
    #addBtn:hover { background: rgba(62, 166, 255, 0.08); border-color: var(--accent); }
    /* On/off switch */
    .toggleRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }
    .toggleText { display: flex; flex-direction: column; gap: 2px; }
    .toggleTitle { font-size: 13px; font-weight: 600; }
    .toggleSub { font-size: 11px; color: var(--muted); }
    .switch { position: relative; flex: none; width: 36px; height: 20px; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch .track {
      position: absolute;
      inset: 0;
      background: #555;
      border-radius: 999px;
      transition: background 150ms;
    }
    .switch .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      transition: transform 150ms;
    }
    .switch input:checked + .track { background: var(--accent); }
    .switch input:checked + .track::after { transform: translateX(16px); }
    .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
    body.buttons-off #list { opacity: 0.45; }

    .status { margin-top: 8px; font-size: 12px; color: #2ba640; min-height: 16px; text-align: center; }
  </style>
</head>
<body>
  <h3>Youtube Buttons</h3>
  <div class="hint">Each entry creates a button on video thumbnails. Changes save automatically.</div>

  <label class="toggleRow" for="enabledToggle">
    <span class="toggleText">
      <span class="toggleTitle">Show buttons on YouTube</span>
      <span class="toggleSub" id="enabledSub">Buttons are visible on thumbnails</span>
    </span>
    <span class="switch">
      <input type="checkbox" id="enabledToggle" role="switch" checked />
      <span class="track"></span>
    </span>
  </label>

  <div id="list"></div>

  <div class="actions">
    <button id="addBtn" type="button">+ Add button</button>
  </div>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
