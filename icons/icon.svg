<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Source artwork for the extension icon (not shipped in the zip).
       Rendered to icon16/32/48/128.png. Full-bleed version; the 128 px
       store icon is rendered with 16 px of transparent padding. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b5cff"/>
      <stop offset="0.55" stop-color="#c13cff"/>
      <stop offset="1" stop-color="#ff3d71"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c13cff"/>
      <stop offset="1" stop-color="#ff3d71"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2a0040" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#shine)"/>

  <!-- Playlist lines (pill-shaped, like the buttons the extension adds) -->
  <rect x="22" y="28" width="62" height="14" rx="7" fill="#fff"/>
  <rect x="22" y="53" width="62" height="14" rx="7" fill="#fff" fill-opacity="0.9"/>
  <rect x="22" y="78" width="36" height="14" rx="7" fill="#fff" fill-opacity="0.8"/>

  <!-- "Add" badge -->
  <g filter="url(#shadow)">
    <circle cx="92" cy="90" r="26" fill="#fff"/>
  </g>
  <path d="M92 77v26M79 90h26" stroke="url(#plus)" stroke-width="8" stroke-linecap="round"/>
</svg>
